name: KernelSU Next OnePlus 5 Integration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernelsu-next-oneplus5-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate and validate KernelSU Next
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OnePlus 5 kernel
        uses: actions/checkout@v4
        with:
          ref: lineage-22.2
          fetch-depth: 0

      - name: Install build configuration dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev

      - name: Checkout reference patches
        uses: actions/checkout@v4
        with:
          repository: TosteRino/joan-kernelsu
          ref: main
          path: reference

      - name: Verify OnePlus 5 kernel source
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f arch/arm64/configs/lineage_oneplus5_defconfig
          test -f fs/exec.c
          test -f fs/open.c
          test -f fs/read_write.c
          test -f fs/stat.c
          test -f kernel/sys.c
          test -f kernel/reboot.c
          test -f security/selinux/hooks.c

          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 4$' Makefile
          grep -q '^SUBLEVEL = 302$' Makefile

          echo "Verified Linux 4.4.302 OnePlus 5 kernel."

      - name: Verify required reference patches
        shell: bash
        run: |
          set -euo pipefail

          for patch in \
            reference/patches/kernelsu-next-linux-4.4-compat.diff \
            reference/patches/manual-hooks-linux-4.4.diff
          do
            test -s "$patch"
            echo "Found: $patch"
            sha256sum "$patch"
          done

          echo "The Joan-specific post-kernelsu.diff is intentionally excluded."

      - name: Integrate KernelSU Next legacy source
        shell: bash
        run: |
          set -euo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          test -d KernelSU-Next
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          echo "KernelSU Next source integration completed."

      - name: Pin KernelSU Next to reference revision
        shell: bash
        run: |
          set -euo pipefail

          cd KernelSU-Next

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "Fetching complete legacy branch history..."
            git fetch --unshallow origin legacy
          fi

          if ! git cat-file -e 'a54e4fa4^{commit}' 2>/dev/null; then
            git fetch origin legacy
          fi

          git cat-file -e 'a54e4fa4^{commit}'

          git checkout --detach a54e4fa4

          KSU_REVISION="$(git rev-parse HEAD)"

          echo "KSU_REVISION=$KSU_REVISION" >> "$GITHUB_ENV"

          echo "Selected KernelSU Next revision:"
          git log -1 --oneline

      - name: Apply Linux 4.4 compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$GITHUB_WORKSPACE/reference/patches/kernelsu-next-linux-4.4-compat.diff"

          echo "Checking compatibility patch inside KernelSU Next..."

          git -C KernelSU-Next apply --check "$PATCH"

          echo "Applying compatibility patch..."

          git -C KernelSU-Next apply "$PATCH"

          echo "Compatibility patch applied successfully."

      - name: Apply OnePlus 5 manual kernel hooks
        shell: bash
        run: |
          set -euo pipefail

          PATCH="reference/patches/manual-hooks-linux-4.4.diff"

          echo "Checking manual hook patch against OnePlus 5 kernel..."

          git apply --check "$PATCH"

          echo "Applying manual hooks..."

          git apply "$PATCH"

          echo "Manual hook patch applied successfully."

      - name: Enable KernelSU Next manual hooks
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "arch/arm64/configs/lineage_oneplus5_defconfig"
          )

          text = path.read_text()

          options = [
              r"(?m)^CONFIG_KSU=.*\n?",
              r"(?m)^CONFIG_KSU_MANUAL_HOOK=.*\n?",
              r"(?m)^# CONFIG_KSU_MANUAL_HOOK is not set\n?",
              r"(?m)^CONFIG_KSU_KPROBES_HOOK=.*\n?",
              r"(?m)^# CONFIG_KSU_KPROBES_HOOK is not set\n?",
          ]

          for pattern in options:
              text = re.sub(pattern, "", text)

          text = text.rstrip() + """

          # KernelSU Next legacy manual hooks
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          """

          path.write_text(text)

          print("OnePlus 5 defconfig updated.")
          PY

      - name: Validate manual hook references
        shell: bash
        run: |
          set -euo pipefail

          require_hook() {
            local file="$1"
            local hook="$2"

            if ! grep -q "$hook" "$file"; then
              echo "::error::Missing $hook in $file"
              exit 1
            fi

            echo "Verified $hook in $file"
          }

          require_hook fs/exec.c ksu_handle_execveat
          require_hook fs/open.c ksu_handle_faccessat
          require_hook fs/read_write.c ksu_handle_vfs_read

          require_hook fs/stat.c ksu_handle_stat
          require_hook fs/stat.c ksu_handle_newfstat_ret
          require_hook fs/stat.c ksu_handle_fstat64_ret

          require_hook kernel/sys.c ksu_handle_setresuid
          require_hook kernel/reboot.c ksu_handle_sys_reboot

          require_hook security/selinux/hooks.c is_ksu_transition

          require_hook \
            KernelSU-Next/kernel/selinux/selinux.c \
            is_ksu_transition

          echo "All required manual hook references are present."

      - name: Validate KernelSU configuration
        shell: bash
        run: |
          set -euo pipefail

          make ARCH=arm64 lineage_oneplus5_defconfig

          make ARCH=arm64 olddefconfig

          grep -qx 'CONFIG_KSU=y' .config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' .config

          if grep -qx 'CONFIG_KSU_KPROBES_HOOK=y' .config; then
            echo "::error::KPROBES hook mode must be disabled."
            exit 1
          fi

          echo "Validated KernelSU configuration:"
          grep -E \
            'CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_KPROBES_HOOK=' \
            .config || true

      - name: Verify KernelSU source and symlinks
        shell: bash
        run: |
          set -euo pipefail

          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          echo "Checking KernelSU Next symlinks..."

          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"

            if [[ "$target" == *KernelSU-Next* ]]; then
              if [ ! -e "$link" ]; then
                echo "::error::Broken KernelSU symlink: $link"
                exit 1
              fi

              echo "Verified: $link -> $target"
            fi
          done < <(find . -type l -print0)

      - name: Vendor KernelSU Next source into kernel repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Recording exact KernelSU Next revision:"
          echo "$KSU_REVISION"

          if [ -d KernelSU-Next/.git ] || [ -f KernelSU-Next/.git ]; then
            rm -rf KernelSU-Next/.git
          fi

          if [ -e KernelSU-Next/.git ]; then
            echo "::error::Nested Git metadata still exists."
            exit 1
          fi

          echo "KernelSU Next Git metadata removed."
          echo "Source files will be committed with the kernel."

      - name: Stage and validate integration changes
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          git add -f -A KernelSU-Next

          git diff --cached --check

          git ls-files --error-unmatch \
            KernelSU-Next/kernel/Kconfig

          if git ls-files --stage KernelSU-Next \
            | grep -q '^160000 '; then
            echo "::error::KernelSU Next was staged as a Git submodule."
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "::error::No integration changes were staged."
            exit 1
          fi

          echo "Staged integration summary:"
          git diff --cached --stat

          echo "KernelSU Next source file count:"
          git ls-files KernelSU-Next | wc -l

      - name: Commit and push validated integration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Integrate KernelSU Next legacy manual hooks"

          git push origin HEAD:refs/heads/lineage-22.2

          echo "Integration committed and pushed successfully."

      - name: Create integration report
        if: always()
        shell: bash
        run: |
          {
            echo "KernelSU Next OnePlus 5 integration report"
            echo
            echo "Device: OnePlus 5, cheeseburger"
            echo "Platform: Qualcomm MSM8998"
            echo "Kernel: Linux 4.4.302"
            echo "Branch: lineage-22.2"
            echo
            echo "KernelSU Next revision:"
            echo "${KSU_REVISION:-not selected}"
            echo
            echo "Patches used:"
            echo "kernelsu-next-linux-4.4-compat.diff"
            echo "manual-hooks-linux-4.4.diff"
            echo
            echo "Intentionally excluded:"
            echo "post-kernelsu.diff, Joan-specific changes"
            echo
            echo "Latest kernel commit:"
            git log -1 --oneline 2>/dev/null || true
            echo
            echo "Working tree:"
            git status --short 2>/dev/null || true
          } > kernelsu-next-integration-report.txt

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-next-oneplus5-integration-report
          path: kernelsu-next-integration-report.txt
          if-no-files-found: warn
