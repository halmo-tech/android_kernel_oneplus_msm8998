
name: KernelSU Next Legacy Integration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kernelsu-next-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate KernelSU Next for OnePlus 5
    runs-on: ubuntu-22.04

    steps:
      - name: Check out OnePlus 5 kernel
        uses: actions/checkout@v4
        with:
          repository: halmo-tech/android_kernel_oneplus_msm8998
          ref: lineage-22.2
          fetch-depth: 0
          persist-credentials: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            python3-pip \
            unzip \
            wget \
            zip

      - name: Check out reference patches
        uses: actions/checkout@v4
        with:
          repository: TosteRino/joan-kernelsu
          path: reference
          fetch-depth: 1

      - name: Verify kernel source and target configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking kernel version..."
          KERNEL_VERSION="$(make kernelversion)"
          echo "Kernel version: ${KERNEL_VERSION}"

          if [ "${KERNEL_VERSION}" != "4.4.302" ]; then
            echo "::error::Expected kernel version 4.4.302, found ${KERNEL_VERSION}"
            exit 1
          fi

          echo "Checking OnePlus 5 defconfig..."
          test -f arch/arm64/configs/lineage_oneplus5_defconfig

          echo "Kernel source and target defconfig verified."

      - name: Verify required reference patches
        shell: bash
        run: |
          set -euo pipefail

          COMPAT_PATCH="reference/patches/kernelsu-next-linux-4.4-compat.diff"
          HOOKS_PATCH="reference/patches/manual-hooks-linux-4.4.diff"

          test -s "${COMPAT_PATCH}"
          test -s "${HOOKS_PATCH}"

          echo "Required compatibility patch found:"
          echo "${COMPAT_PATCH}"

          echo "Required manual hooks patch found:"
          echo "${HOOKS_PATCH}"

          echo "The Joan-specific post-kernelsu.diff will NOT be applied."

      - name: Install KernelSU Next legacy source
        shell: bash
        run: |
          set -euo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          if [ ! -d KernelSU-Next ]; then
            echo "::error::KernelSU-Next directory was not created."
            exit 1
          fi

          echo "KernelSU Next legacy source installed."

      - name: Pin KernelSU Next to verified legacy revision
        shell: bash
        run: |
          set -euo pipefail

          cd KernelSU-Next

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin legacy
          fi

          if ! git cat-file -e 'a54e4fa4^{commit}' 2>/dev/null; then
            git fetch origin legacy
          fi

          git cat-file -e 'a54e4fa4^{commit}'

          git checkout --detach a54e4fa4

          echo "KernelSU Next revision:"
          git rev-parse HEAD

          cd ..

      - name: Apply Linux 4.4 KernelSU compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="reference/patches/kernelsu-next-linux-4.4-compat.diff"

          echo "Checking compatibility patch inside KernelSU-Next..."
          git -C KernelSU-Next apply --check "../${PATCH}"

          echo "Applying compatibility patch..."
          git -C KernelSU-Next apply "../${PATCH}"

          echo "KernelSU Next compatibility patch applied."

      - name: Apply OnePlus kernel manual hooks patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="reference/patches/manual-hooks-linux-4.4.diff"

          echo "Checking manual hooks patch..."
          git apply --check "${PATCH}"

          echo "Applying manual hooks patch..."
          git apply "${PATCH}"

          echo "Manual hooks patch applied."

      - name: Enable KernelSU Next in OnePlus 5 defconfig
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/lineage_oneplus5_defconfig"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/lineage_oneplus5_defconfig")
          lines = path.read_text().splitlines()

          settings = {
              "CONFIG_KSU": "CONFIG_KSU=y",
              "CONFIG_KSU_MANUAL_HOOK": "CONFIG_KSU_MANUAL_HOOK=y",
              "CONFIG_KSU_KPROBES_HOOK": "# CONFIG_KSU_KPROBES_HOOK is not set",
          }

          keys = set(settings)
          output = []

          for line in lines:
              key = line.split("=", 1)[0]
              if key.startswith("# "):
                  key = key[2:].split(" ", 1)[0]

              if key not in keys:
                  output.append(line)

          output.extend(settings.values())
          path.write_text("\n".join(output) + "\n")
          PY

          echo "Updated defconfig:"
          tail -n 10 "${DEFCONFIG}"

      - name: Validate KernelSU integration and kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required KernelSU source files..."
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile
          test -f KernelSU-Next/kernel/compat/kernel_compat.h

          echo "Checking KernelSU integration references..."
          grep -R -n "KernelSU-Next" Kconfig Makefile drivers 2>/dev/null || true

          echo "Generating OnePlus 5 configuration..."
          make ARCH=arm64 lineage_oneplus5_defconfig

          echo "Running olddefconfig..."
          make ARCH=arm64 olddefconfig

          echo "Checking final configuration..."
          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' .config

          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' .config; then
            echo "::error::KSU Kprobes hook must remain disabled."
            exit 1
          fi

          echo "KernelSU configuration:"
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_KPROBES_HOOK=|# CONFIG_KSU_KPROBES_HOOK)' .config || true

          echo "KernelSU integration and configuration validation passed."

      - name: Remove nested Git metadata and temporary reference checkout
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing KernelSU Next nested Git metadata..."
          rm -rf KernelSU-Next/.git

          if [ -e KernelSU-Next/.git ]; then
            echo "::error::KernelSU-Next Git metadata still exists."
            exit 1
          fi

          echo "Removing temporary reference checkout..."
          rm -rf reference

          if [ -e reference ]; then
            echo "::error::Temporary reference checkout still exists."
            exit 1
          fi

          echo "Temporary repositories removed."

      - name: Stage and validate integration changes
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking that temporary repositories are absent..."
          test ! -e reference
          test ! -e KernelSU-Next/.git

          echo "Staging kernel integration changes..."
          git add -A

          echo "Force-adding KernelSU Next source..."
          git add -f -A KernelSU-Next

          echo "Checking for accidentally staged embedded repositories..."
          if git ls-files --stage -- KernelSU-Next reference | grep -q '^160000 '; then
            echo "::error::An embedded Git repository was staged."
            exit 1
          fi

          echo "Checking kernel integration whitespace..."
          git diff --cached --check -- . ':(exclude)KernelSU-Next/**'

          echo "Verifying KernelSU source files are staged..."
          git ls-files --error-unmatch KernelSU-Next/kernel/Kconfig
          git ls-files --error-unmatch KernelSU-Next/kernel/Makefile
          git ls-files --error-unmatch KernelSU-Next/kernel/compat/kernel_compat.h

          echo "Checking that generated .config is not staged..."
          git reset -q -- .config || true

          echo "Staged integration summary:"
          git diff --cached --stat

          echo "KernelSU Next staged source file count:"
          git ls-files KernelSU-Next | wc -l

          if git diff --cached --quiet; then
            echo "::error::No integration changes were staged."
            exit 1
          fi

          echo "Staging validation passed."

      - name: Commit and push validated integration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Integrate KernelSU Next legacy for OnePlus 5"

          echo "Pushing validated integration to lineage-22.2..."
          git push origin HEAD:lineage-22.2

          echo "Integration commit pushed successfully."

      - name: Generate integration report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          REPORT="kernelsu-next-integration-report.txt"

          {
            echo "KernelSU Next Legacy Integration Report"
            echo "========================================"
            echo
            echo "Target: OnePlus 5 (cheeseburger)"
            echo "Kernel: Linux 4.4.302"
            echo "Kernel repository: halmo-tech/android_kernel_oneplus_msm8998"
            echo "Branch: lineage-22.2"
            echo "KernelSU Next revision: a54e4fa4"
            echo "Defconfig: lineage_oneplus5_defconfig"
            echo
            echo "Applied patches:"
            echo "- kernelsu-next-linux-4.4-compat.diff"
            echo "- manual-hooks-linux-4.4.diff"
            echo
            echo "Excluded patch:"
            echo "- post-kernelsu.diff (Joan-specific, not applied)"
            echo
            echo "Configuration:"
            echo "- CONFIG_KSU=y"
            echo "- CONFIG_KSU_MANUAL_HOOK=y"
            echo "- CONFIG_KSU_KPROBES_HOOK disabled"
            echo
            echo "Latest commit:"
            git log -1 --oneline 2>/dev/null || true
            echo
            echo "Working tree status:"
            git status --short 2>/dev/null || true
            echo
            echo "Important:"
            echo "This workflow validates source integration and kernel configuration."
            echo "It does not compile a complete boot image or verify device boot."
            echo "No phone partitions are modified by this workflow."
          } > "${REPORT}"

          cat "${REPORT}"

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-next-integration-report
          path: kernelsu-next-integration-report.txt
          if-no-files-found: warn
