
name: OnePlus 5 KernelSU Next Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out OnePlus 5 kernel
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 1

      - name: Check kernel version and device configuration
        run: |
          echo "=== Kernel version ==="
          head -n 4 Makefile

          echo "=== OnePlus 5 defconfig ==="
          if [ -f arch/arm64/configs/lineage_oneplus5_defconfig ]; then
            grep -nE 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES' \
              arch/arm64/configs/lineage_oneplus5_defconfig || true
          else
            echo "ERROR: Expected defconfig not found"
            exit 1
          fi

      - name: Integrate KernelSU Next legacy source
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

          echo "=== KernelSU Next version ==="
          git -C KernelSU-Next describe --tags --always

          echo "=== KernelSU source integration ==="
          ls -ld drivers/kernelsu
          grep -n kernelsu drivers/Makefile
          grep -n kernelsu drivers/Kconfig


      - name: Inspect KernelSU integration locations
        run: |
          echo "=== KernelSU configuration ==="
          grep -nE 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES' \
            arch/arm64/configs/lineage_oneplus5_defconfig || true

          echo "=== fs/exec.c ==="
          sed -n '1665,1730p' fs/exec.c

          echo "=== fs/open.c ==="
          sed -n '335,375p' fs/open.c

          echo "=== fs/read_write.c ==="
          sed -n '425,470p' fs/read_write.c

          echo "=== fs/stat.c ==="
          sed -n '280,315p' fs/stat.c

          echo "=== kernel/reboot.c ==="
          sed -n '275,310p' kernel/reboot.c
