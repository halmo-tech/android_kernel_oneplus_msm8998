
name: OnePlus 5 KernelSU Next Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out OnePlus 5 kernel
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 1

      - name: Check kernel version and device configuration
        run: |
          echo "=== Kernel version ==="
          head -n 4 Makefile

          echo "=== OnePlus 5 defconfig ==="
          if [ -f arch/arm64/configs/lineage_oneplus5_defconfig ]; then
            grep -nE 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES' \
              arch/arm64/configs/lineage_oneplus5_defconfig || true
          else
            echo "ERROR: Expected defconfig not found"
            exit 1
          fi

      - name: Integrate KernelSU Next legacy source
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

          echo "=== KernelSU Next version ==="
          git -C KernelSU-Next describe --tags --always

          echo "=== KernelSU source integration ==="
          ls -ld drivers/kernelsu
          grep -n kernelsu drivers/Makefile
          grep -n kernelsu drivers/Kconfig



      - name: Inspect Linux 4.4 integration points
        run: |
          echo "=== KernelSU configuration ==="
          grep -nE 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES' \
            arch/arm64/configs/lineage_oneplus5_defconfig || true

          echo "=== KernelSU hook options ==="
          grep -nE 'KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|config KSU' \
            drivers/kernelsu/Kconfig || true

          echo "=== fs/exec.c ==="
          sed -n '1520,1685p' fs/exec.c

          echo "=== fs/open.c ==="
          sed -n '340,420p' fs/open.c

          echo "=== fs/read_write.c: vfs_read ==="
          sed -n '430,470p' fs/read_write.c
          echo "=== fs/read_write.c: read syscall ==="
          sed -n '555,585p' fs/read_write.c

          echo "=== fs/stat.c ==="
          sed -n '285,370p' fs/stat.c
          sed -n '420,530p' fs/stat.c

          echo "=== kernel/sys.c: setresuid ==="
          grep -n -B8 -A45 'SYSCALL_DEFINE3(setresuid' \
            kernel/sys.c || true

          echo "=== kernel/reboot.c ==="
          sed -n '275,330p' kernel/reboot.c

          echo "=== SELinux bounded transition ==="
          grep -n -B8 -A35 'security_bounded_transition' \
            security/selinux/hooks.c || true
