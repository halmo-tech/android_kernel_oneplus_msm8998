
name: OnePlus 5 KernelSU Next Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inspect OnePlus 5 kernel integration points
    runs-on: ubuntu-22.04

    steps:
      - name: Check out OnePlus 5 kernel source
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 1

      - name: Add KernelSU Next legacy source
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Inspect kernel source and KernelSU interfaces
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          output = []

          def report(title, content):
              output.append("")
              output.append("=" * 75)
              output.append(title)
              output.append("=" * 75)
              output.append(content)

          def inspect_file(filename, patterns, radius=18):
              path = Path(filename)

              if not path.exists():
                  report(filename, "FILE NOT FOUND")
                  return

              lines = path.read_text(errors="replace").splitlines()
              sections = []
              found_ranges = []

              for number, line in enumerate(lines):
                  for pattern in patterns:
                      if re.search(pattern, line):
                          start = max(0, number - radius)
                          end = min(len(lines), number + radius + 1)

                          if not any(
                              start < old_end and end > old_start
                              for old_start, old_end in found_ranges
                          ):
                              found_ranges.append((start, end))
                              sections.append(
                                  "\n--- Lines {} to {} ---\n{}".format(
                                      start + 1,
                                      end,
                                      "\n".join(
                                          f"{i + 1}: {lines[i]}"
                                          for i in range(start, end)
                                      )
                                  )
                              )

              report(
                  filename,
                  "\n".join(sections)
                  if sections
                  else "No matching functions found."
              )

          report(
              "DEVICE AND BRANCH",
              "Repository: halmo-tech/android_kernel_oneplus_msm8998\n"
              "Branch: lineage-22.2\n"
              "Target: OnePlus 5 (cheeseburger)\n"
              "Kernel family: Linux 4.4"
          )

          inspect_file(
              "fs/exec.c",
              [
                  r"do_execve\s*\(",
                  r"compat_do_execve\s*\(",
                  r"do_execveat_common\s*\("
              ],
              24
          )

          inspect_file(
              "fs/open.c",
              [
                  r"SYSCALL_DEFINE3\s*\(\s*faccessat"
              ],
              28
          )

          inspect_file(
              "fs/read_write.c",
              [
                  r"vfs_read\s*\(",
                  r"SYSCALL_DEFINE3\s*\(\s*read"
              ],
              28
          )

          inspect_file(
              "fs/stat.c",
              [
                  r"SYSCALL_DEFINE4\s*\(\s*newfstatat"
              ],
              28
          )

          inspect_file(
              "kernel/reboot.c",
              [
                  r"SYSCALL_DEFINE4\s*\(\s*reboot"
              ],
              28
          )

          inspect_file(
              "arch/arm64/configs/lineage_oneplus5_defconfig",
              [
                  r"CONFIG_KSU",
                  r"CONFIG_KPROBES",
                  r"CONFIG_MODULES"
              ],
              5
          )

          ksu_paths = [
              "KernelSU",
              "drivers/kernelsu",
              "KernelSU/kernel",
              "drivers/kernelsu/kernel"
          ]

          for name in ksu_paths:
              path = Path(name)

              if path.exists():
                  config_files = list(path.rglob("Kconfig"))[:10]

                  report(
                      "KernelSU source location",
                      f"Found: {name}\n"
                      + (
                          "\n".join(str(p) for p in config_files)
                          if config_files
                          else "No Kconfig files found in this location."
                      )
                  )

          config_found = False

          for path in Path(".").rglob("Kconfig"):
              if "KernelSU" in str(path) or "kernelsu" in str(path).lower():
                  text = path.read_text(errors="replace")

                  if "config KSU" in text:
                      config_found = True
                      report(
                          f"KernelSU Kconfig: {path}",
                          text[:16000]
                      )

          if not config_found:
              report(
                  "KernelSU Kconfig search",
                  "No Kconfig containing config KSU was found."
              )

          handler_names = [
              "ksu_handle_execveat",
              "ksu_handle_faccessat",
              "ksu_handle_sys_read",
              "ksu_handle_vfs_read",
              "ksu_handle_stat",
              "ksu_handle_sys_reboot"
          ]

          declaration_count = 0

          for path in Path(".").rglob("*.h"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(errors="replace")
              matches = [
                  name for name in handler_names
                  if name in text
              ]

              if matches:
                  declaration_count += 1
                  report(
                      f"KernelSU hook declarations: {path}",
                      "\n".join(matches) + "\n\n" + text[:12000]
                  )

          if declaration_count == 0:
              report(
                  "KernelSU hook declarations",
                  "No matching handler declarations found in header files."
              )

          report(
              "AUDIT RESULT",
              "Source inspection completed. No kernel source files were "
              "patched by this audit."
          )

          Path("kernelsu-source-audit.txt").write_text(
              "\n".join(output) + "\n"
          )

          print("Source audit completed.")
          print("Report saved as kernelsu-source-audit.txt")
          PY

      - name: Upload source audit report
        uses: actions/upload-artifact@v4
        with:
          name: oneplus5-kernelsu-source-audit
          path: kernelsu-source-audit.txt
          if-no-files-found: error
