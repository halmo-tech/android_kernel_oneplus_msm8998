
name: OnePlus 5 KernelSU Next Integration Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify KernelSU Next hook implementations
    runs-on: ubuntu-22.04

    steps:
      - name: Check out OnePlus 5 kernel source
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 1

      - name: Add KernelSU Next legacy source
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Inspect exact kernel hook locations and implementations
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          report = []

          def section(title, content):
              report.append("")
              report.append("=" * 78)
              report.append(title)
              report.append("=" * 78)
              report.append(content)

          def inspect_kernel_file(filename, patterns, radius=16):
              path = Path(filename)

              if not path.exists():
                  section(filename, "FILE NOT FOUND")
                  return

              lines = path.read_text(errors="replace").splitlines()
              ranges = []
              blocks = []

              for number, line in enumerate(lines):
                  if any(re.search(p, line) for p in patterns):
                      start = max(0, number - radius)
                      end = min(len(lines), number + radius + 1)

                      if any(
                          start < old_end and end > old_start
                          for old_start, old_end in ranges
                      ):
                          continue

                      ranges.append((start, end))
                      blocks.append(
                          "\n--- Lines {} to {} ---\n{}".format(
                              start + 1,
                              end,
                              "\n".join(
                                  f"{i + 1}: {lines[i]}"
                                  for i in range(start, end)
                              )
                          )
                      )

              section(
                  filename,
                  "\n".join(blocks)
                  if blocks else "No matching locations found."
              )

          section(
              "DEVICE",
              "OnePlus 5 (cheeseburger)\n"
              "Kernel source branch: lineage-22.2\n"
              "Kernel version: Linux 4.4.302"
          )

          inspect_kernel_file(
              "fs/exec.c",
              [
                  r"SYSCALL_DEFINE3\s*\(\s*execve",
                  r"COMPAT_SYSCALL_DEFINE3\s*\(\s*execve",
                  r"do_execve\s*\(",
                  r"compat_do_execve\s*\("
              ],
              22
          )

          inspect_kernel_file(
              "fs/open.c",
              [r"SYSCALL_DEFINE3\s*\(\s*faccessat"],
              24
          )

          inspect_kernel_file(
              "fs/read_write.c",
              [r"vfs_read\s*\("],
              24
          )

          inspect_kernel_file(
              "fs/stat.c",
              [r"SYSCALL_DEFINE4\s*\(\s*newfstatat"],
              20
          )

          inspect_kernel_file(
              "kernel/reboot.c",
              [r"SYSCALL_DEFINE4\s*\(\s*reboot"],
              22
          )

          inspect_kernel_file(
              "arch/arm64/configs/lineage_oneplus5_defconfig",
              [
                  r"CONFIG_KSU",
                  r"CONFIG_KPROBES",
                  r"CONFIG_MODULES"
              ],
              6
          )

          ksu_root = Path("KernelSU-Next/kernel")

          if not ksu_root.exists():
              ksu_root = Path("drivers/kernelsu")

          section("KERNELSU SOURCE ROOT", str(ksu_root))

          symbols = [
              "ksu_handle_sys_reboot",
              "ksu_handle_execve_ksud",
              "ksu_handle_compat_execve_ksud",
              "ksu_handle_execveat_ksud",
              "ksu_handle_vfs_read",
              "ksu_handle_sys_read",
              "ksu_handle_faccessat",
              "ksu_handle_stat"
          ]

          source_extensions = {
              ".c", ".h", ".mk"
          }

          matches_found = 0

          if ksu_root.exists():
              for path in ksu_root.rglob("*"):
                  if not path.is_file():
                      continue

                  if path.suffix not in source_extensions:
                      continue

                  try:
                      lines = path.read_text(
                          errors="replace"
                      ).splitlines()
                  except OSError:
                      continue

                  for number, line in enumerate(lines):
                      matched = [
                          symbol for symbol in symbols
                          if symbol in line
                      ]

                      if not matched:
                          continue

                      matches_found += 1
                      start = max(0, number - 7)
                      end = min(len(lines), number + 13)

                      section(
                          f"KERNELSU SYMBOL: {path}:{number + 1}",
                          "Matched: " + ", ".join(matched) + "\n\n"
                          + "\n".join(
                              f"{i + 1}: {lines[i]}"
                              for i in range(start, end)
                          )
                      )

          if matches_found == 0:
              section(
                  "KERNELSU SYMBOL SEARCH",
                  "No matching handler symbols found."
              )

          section(
              "AUDIT COMPLETION",
              "Inspection finished. No kernel source files were modified."
          )

          Path("kernelsu-hook-implementation-audit.txt").write_text(
              "\n".join(report) + "\n"
          )

          print("KernelSU hook implementation audit completed.")
          print("Report: kernelsu-hook-implementation-audit.txt")
          PY

      - name: Upload detailed audit report
        uses: actions/upload-artifact@v6
        with:
          name: oneplus5-kernelsu-hook-audit
          path: kernelsu-hook-implementation-audit.txt
          if-no-files-found: error
