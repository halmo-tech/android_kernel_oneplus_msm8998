name: OnePlus 5 KernelSU Next Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile OnePlus 5 KernelSU Next kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 0

      - name: Verify KernelSU Next integration commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="8e7088d77725"

          echo "Checking integration commit..."

          if ! git merge-base --is-ancestor "${EXPECTED_COMMIT}" HEAD; then
            echo "ERROR: KernelSU Next integration commit is missing."
            exit 1
          fi

          echo "Integration commit is present."
          echo "Current commit: $(git rev-parse --short HEAD)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-pip \
            unzip \
            zip \
            zstd

      - name: Download Android NDK r25c
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="r25c"
          NDK_ARCHIVE="android-ndk-${NDK_VERSION}-linux.zip"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${NDK_ARCHIVE}"

          unzip -q "${NDK_ARCHIVE}" -d "${GITHUB_WORKSPACE}"

          echo "ANDROID_NDK_HOME=${GITHUB_WORKSPACE}/android-ndk-${NDK_VERSION}" >> "${GITHUB_ENV}"

          echo "${GITHUB_WORKSPACE}/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "${GITHUB_PATH}"

          echo "Android NDK installed."

      - name: Download Android GCC 4.9 toolchains
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/toolchains"

          git clone \
            --depth 1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "${GITHUB_WORKSPACE}/toolchains/aarch64"

          git clone \
            --depth 1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "${GITHUB_WORKSPACE}/toolchains/arm"

          echo "${GITHUB_WORKSPACE}/toolchains/aarch64/bin" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/toolchains/arm/bin" >> "${GITHUB_PATH}"

          echo "GCC toolchains installed."

      - name: Show compiler versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Clang:"
          clang --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-android-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-androideabi-gcc --version

      - name: Apply KernelSU Next Linux 4.4 build fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # --------------------------------------------------
          # Fix 1: copy_to_iter const compatibility
          # --------------------------------------------------

          integration = Path(
              "drivers/kernelsu/runtime/ksud_integration.c"
          )

          if not integration.is_file():
              raise SystemExit(
                  f"ERROR: {integration} was not found."
              )

          source = integration.read_text()

          original = "copy_to_iter(KERNEL_SU_RC + ksu_rc_pos,"
          fixed = "copy_to_iter((void *)(KERNEL_SU_RC + ksu_rc_pos),"

          if fixed in source:
              print("copy_to_iter compatibility fix already present.")
          elif original in source:
              if source.count(original) != 1:
                  raise SystemExit(
                      "ERROR: Unexpected number of copy_to_iter calls."
                  )

              source = source.replace(original, fixed, 1)
              integration.write_text(source)

              print("Applied copy_to_iter compatibility fix.")
          else:
              raise SystemExit(
                  "ERROR: Expected copy_to_iter call was not found."
              )

          # --------------------------------------------------
          # Fix 2: backport path_umount into fs/namespace.c
          # --------------------------------------------------

          namespace = Path("fs/namespace.c")

          if not namespace.is_file():
              raise SystemExit("ERROR: fs/namespace.c was not found.")

          source = namespace.read_text()

          can_signature = (
              "static int can_umount(const struct path *path, int flags)"
          )

          umount_signature = (
              "int path_umount(struct path *path, int flags)"
          )

          has_can = can_signature in source
          has_umount = umount_signature in source

          if has_can != has_umount:
              raise SystemExit(
                  "ERROR: Only part of the path_umount backport "
                  "already exists. Stopping to avoid duplicate or "
                  "incomplete kernel functions."
              )

          if not has_can:
              anchor = (
                  "static bool is_mnt_ns_file(struct dentry *dentry)"
              )

              if source.count(anchor) != 1:
                  raise SystemExit(
                      "ERROR: Could not uniquely locate the "
                      "is_mnt_ns_file insertion point in fs/namespace.c."
                  )

              backport = r'''
          static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);

              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;
              if (!may_mount())
                  return -EPERM;
              if (path->dentry != path->mnt->mnt_root)
                  return -EINVAL;
              if (!check_mnt(mnt))
                  return -EINVAL;
              if (mnt->mnt.mnt_flags & MNT_LOCKED)
                  return -EINVAL;
              if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                  return -EPERM;
              return 0;
          }

          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;

              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);

              /* Do not use path_put(), which clears mnt_expiry_mark. */
              dput(path->dentry);
              mntput_no_expire(mnt);
              return ret;
          }

          '''

              source = source.replace(
                  anchor,
                  backport + anchor,
                  1
              )

              namespace.write_text(source)

              print("Inserted path_umount backport into fs/namespace.c.")
          else:
              print("path_umount implementation already exists.")

          # --------------------------------------------------
          # Fix 3: add path_umount declaration to fs/internal.h
          # --------------------------------------------------

          internal = Path("fs/internal.h")

          if not internal.is_file():
              raise SystemExit("ERROR: fs/internal.h was not found.")

          header = internal.read_text()

          declaration = (
              "int path_umount(struct path *path, int flags);"
          )

          if declaration not in header:
              anchor = "extern void __init mnt_init(void);"

              if header.count(anchor) != 1:
                  raise SystemExit(
                      "ERROR: Could not uniquely locate the "
                      "mnt_init declaration in fs/internal.h."
                  )

              header = header.replace(
                  anchor,
                  anchor + "\n" + declaration,
                  1
              )

              internal.write_text(header)

              print("Added path_umount declaration to fs/internal.h.")
          else:
              print("path_umount declaration already exists.")

          # --------------------------------------------------
          # Verify all three fixes before compilation
          # --------------------------------------------------

          namespace_text = namespace.read_text()
          header_text = internal.read_text()
          integration_text = integration.read_text()

          if namespace_text.count(can_signature) != 1:
              raise SystemExit(
                  "ERROR: can_umount implementation verification failed."
              )

          if namespace_text.count(umount_signature) != 1:
              raise SystemExit(
                  "ERROR: path_umount implementation verification failed."
              )

          if header_text.count(declaration) != 1:
              raise SystemExit(
                  "ERROR: path_umount declaration verification failed."
              )

          if fixed not in integration_text:
              raise SystemExit(
                  "ERROR: copy_to_iter compatibility verification failed."
              )

          print()
          print("All KernelSU Next Linux 4.4 build fixes verified.")
          PY

          echo
          echo "Checking path_umount insertion:"
          grep -n -E 'can_umount|path_umount' fs/namespace.c
          grep -n -F 'int path_umount' fs/internal.h

      - name: Generate OnePlus 5 kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          make -j2 \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            lineage_oneplus5_defconfig

          echo
          echo "Checking KernelSU configuration..."

          grep -E '^CONFIG_KSU(=|_)' out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "ERROR: CONFIG_KSU is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK is not enabled."
            exit 1
          fi

          echo "KernelSU configuration verified."

      - name: Compile OnePlus 5 KernelSU Next kernel
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          JOBS="$(nproc --all)"

          echo "Using ${JOBS} parallel build jobs."
          echo "Starting OnePlus 5 kernel compilation..."

          make -j"${JOBS}" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            Image.gz dtbs \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel-build.log"

      - name: Verify kernel build outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "${IMAGE}" ]; then
            echo "ERROR: Image.gz was not generated."
            exit 1
          fi

          echo "Kernel image successfully generated:"
          ls -lh "${IMAGE}"

          echo
          echo "Device tree blobs:"

          find out/arch/arm64/boot/dts -type f -name '*.dtb' -print

          DTB_COUNT="$(find out/arch/arm64/boot/dts -type f -name '*.dtb' | wc -l)"

          if [ "${DTB_COUNT}" -eq 0 ]; then
            echo "ERROR: No DTB files were generated."
            exit 1
          fi

          echo
          echo "Found ${DTB_COUNT} DTB files."

      - name: Generate build report
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail

          REPORT="kernel-build-report.txt"

          {
            echo "OnePlus 5 KernelSU Next Kernel Build Report"
            echo "============================================"
            echo
            echo "Device: OnePlus 5 (cheeseburger)"
            echo "Architecture: ARM64"
            echo "Kernel version: 4.4.302"
            echo "Branch: lineage-22.2"
            echo "Integration commit: 8e7088d77725"
            echo "KernelSU Next revision: a54e4fa4"
            echo "Defconfig: lineage_oneplus5_defconfig"
            echo "Compiler: Clang 14.0.7"
            echo "Build step outcome: ${BUILD_OUTCOME:-unknown}"
            echo
            echo "KernelSU configuration:"

            if [ -f out/.config ]; then
              grep -E '^CONFIG_KSU(=|_)' out/.config || true
            else
              echo "Configuration file not found."
            fi

            echo
            echo "Kernel image:"

            if [ -f out/arch/arm64/boot/Image.gz ]; then
              ls -lh out/arch/arm64/boot/Image.gz
            else
              echo "Image.gz was not generated."
            fi

            echo
            echo "Device tree blobs:"

            if [ -d out/arch/arm64/boot/dts ]; then
              find out/arch/arm64/boot/dts -type f -name '*.dtb' -print
            else
              echo "DTB directory not found."
            fi

            echo
            echo "Current source commit:"
            git rev-parse HEAD

            echo
            echo "Build log: kernel-build.log"

          } > "${REPORT}"

          cat "${REPORT}"

      - name: Upload kernel build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus5-kernelsu-next-kernel-build
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/vmlinux
            out/System.map
            out/.config
            kernel-build.log
            kernel-build-report.txt
