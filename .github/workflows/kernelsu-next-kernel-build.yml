name: OnePlus 5 KernelSU Next Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile OnePlus 5 KernelSU Next kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 0

      - name: Verify KernelSU Next integration commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="8e7088d77725"

          echo "Checking integration commit..."

          if ! git merge-base --is-ancestor "${EXPECTED_COMMIT}" HEAD; then
            echo "ERROR: KernelSU Next integration commit is missing."
            exit 1
          fi

          echo "Integration commit is present."
          echo "Current commit: $(git rev-parse --short HEAD)"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-pip \
            unzip \
            zip \
            zstd

      - name: Download Android NDK r25c
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="r25c"
          NDK_ARCHIVE="android-ndk-${NDK_VERSION}-linux.zip"

          curl -fL \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "${NDK_ARCHIVE}"

          unzip -q "${NDK_ARCHIVE}" -d "${GITHUB_WORKSPACE}"

          echo "ANDROID_NDK_HOME=${GITHUB_WORKSPACE}/android-ndk-${NDK_VERSION}" >> "${GITHUB_ENV}"

          echo "${GITHUB_WORKSPACE}/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "${GITHUB_PATH}"

          echo "Android NDK installed."

      - name: Download Android GCC 4.9 toolchains
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/toolchains"

          git clone \
            --depth 1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "${GITHUB_WORKSPACE}/toolchains/aarch64"

          git clone \
            --depth 1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "${GITHUB_WORKSPACE}/toolchains/arm"

          echo "${GITHUB_WORKSPACE}/toolchains/aarch64/bin" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/toolchains/arm/bin" >> "${GITHUB_PATH}"

          echo "GCC toolchains installed."

      - name: Show compiler versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Clang:"
          clang --version

          echo
          echo "AArch64 GCC:"
          aarch64-linux-android-gcc --version

          echo
          echo "ARM32 GCC:"
          arm-linux-androideabi-gcc --version

      - name: Apply copy_to_iter compatibility fix
        shell: bash
        run: |
          set -euo pipefail

          FILE="drivers/kernelsu/runtime/ksud_integration.c"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} was not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/kernelsu/runtime/ksud_integration.c")
          source = path.read_text()

          original = "copy_to_iter(KERNEL_SU_RC + ksu_rc_pos,"
          fixed = "copy_to_iter((void *)(KERNEL_SU_RC + ksu_rc_pos),"

          if fixed in source:
              print("Compatibility fix is already present.")
          elif original in source:
              count = source.count(original)

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Expected exactly one occurrence, found {count}."
                  )

              source = source.replace(original, fixed, 1)
              path.write_text(source)

              print("Applied copy_to_iter compatibility fix.")
          else:
              raise SystemExit(
                  "ERROR: Could not find the expected copy_to_iter call. "
                  "No source changes were made."
              )
          PY

          echo
          echo "Updated source line:"
          grep -n -F "copy_to_iter((void *)(KERNEL_SU_RC" "${FILE}"

      - name: Generate OnePlus 5 kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          make -j2 \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            lineage_oneplus5_defconfig

          echo
          echo "Checking KernelSU configuration..."

          grep -E '^CONFIG_KSU(=|_)' out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "ERROR: CONFIG_KSU is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK is not enabled."
            exit 1
          fi

          echo "KernelSU configuration verified."

      - name: Compile OnePlus 5 KernelSU Next kernel
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          JOBS="$(nproc --all)"

          echo "Using ${JOBS} parallel build jobs."
          echo "Starting OnePlus 5 kernel compilation..."

          make -j"${JOBS}" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            Image.gz dtbs \
            2>&1 | tee "${GITHUB_WORKSPACE}/kernel-build.log"

      - name: Verify kernel build outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "${IMAGE}" ]; then
            echo "ERROR: Image.gz was not generated."
            exit 1
          fi

          echo "Kernel image successfully generated:"
          ls -lh "${IMAGE}"

          echo
          echo "Device tree blobs:"

          find out/arch/arm64/boot/dts -type f -name '*.dtb' -print

          DTB_COUNT="$(find out/arch/arm64/boot/dts -type f -name '*.dtb' | wc -l)"

          if [ "${DTB_COUNT}" -eq 0 ]; then
            echo "ERROR: No DTB files were generated."
            exit 1
          fi

          echo
          echo "Found ${DTB_COUNT} DTB files."

      - name: Generate build report
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail

          REPORT="kernel-build-report.txt"

          {
            echo "OnePlus 5 KernelSU Next Kernel Build Report"
            echo "============================================"
            echo
            echo "Device: OnePlus 5 (cheeseburger)"
            echo "Architecture: ARM64"
            echo "Kernel version: 4.4.302"
            echo "Branch: lineage-22.2"
            echo "Integration commit: 8e7088d77725"
            echo "KernelSU Next revision: a54e4fa4"
            echo "Defconfig: lineage_oneplus5_defconfig"
            echo "Compiler: Clang 14.0.7"
            echo "Build step outcome: ${BUILD_OUTCOME:-unknown}"
            echo
            echo "KernelSU configuration:"
            if [ -f out/.config ]; then
              grep -E '^CONFIG_KSU(=|_)' out/.config || true
            else
              echo "Configuration file not found."
            fi
            echo
            echo "Kernel image:"
            if [ -f out/arch/arm64/boot/Image.gz ]; then
              ls -lh out/arch/arm64/boot/Image.gz
            else
              echo "Image.gz was not generated."
            fi
            echo
            echo "Device tree blobs:"
            if [ -d out/arch/arm64/boot/dts ]; then
              find out/arch/arm64/boot/dts -type f -name '*.dtb' -print
            else
              echo "DTB directory not found."
            fi
            echo
            echo "Current source commit:"
            git rev-parse HEAD
            echo
            echo "Build log: kernel-build.log"
          } > "${REPORT}"

          cat "${REPORT}"

      - name: Upload kernel build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus5-kernelsu-next-kernel-build
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/vmlinux
            out/System.map
            out/.config
            kernel-build.log
            kernel-build-report.txt
