name: OnePlus 5 KernelSU Next Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KSU_REVISION: a54e4fa4
  KSU_VERSION: "33193"
  KSU_VERSION_TAG: v3.2.0-legacy-14
  JOBS: "2"

jobs:
  build:
    name: Build KernelSU Next for OnePlus 5
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2
          fetch-depth: 0

      - name: Verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          test -f Makefile
          test -f arch/arm64/configs/lineage_oneplus5_defconfig
          test -f reference/patches/kernelsu-next-linux-4.4-compat.diff

          git merge-base --is-ancestor 8e7088d77725 HEAD

          echo "Kernel source commit:"
          git rev-parse HEAD

          echo "KernelSU integration commit verified."

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            unzip \
            zip

      - name: Download Android NDK r25c
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip" \
            -o android-ndk-r25c-linux.zip

          unzip -q android-ndk-r25c-linux.zip

          NDK_BIN="$GITHUB_WORKSPACE/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDK_BIN/clang"

          echo "$NDK_BIN" >> "$GITHUB_PATH"

          echo "NDK Clang:"
          "$NDK_BIN/clang" --version

      - name: Download Android GCC cross compilers
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          AARCH64_BIN="$GITHUB_WORKSPACE/gcc64/bin"
          ARM32_BIN="$GITHUB_WORKSPACE/gcc32/bin"

          AARCH64_GCC="$AARCH64_BIN/aarch64-linux-android-gcc"
          ARM32_GCC="$ARM32_BIN/arm-linux-androideabi-gcc"

          if [ ! -x "$AARCH64_GCC" ]; then
            echo "ERROR: AArch64 GCC compiler is missing."
            exit 1
          fi

          if [ ! -x "$ARM32_GCC" ]; then
            echo "ERROR: ARM32 GCC compiler is missing."
            exit 1
          fi

          echo "AArch64 GCC:"
          "$AARCH64_GCC" --version

          echo "ARM32 GCC:"
          "$ARM32_GCC" --version

          # These PATH additions take effect in subsequent GitHub Actions steps.
          echo "$AARCH64_BIN" >> "$GITHUB_PATH"
          echo "$ARM32_BIN" >> "$GITHUB_PATH"

          echo "Both GCC compilers verified."

      - name: Verify compiler PATH
        shell: bash
        run: |
          set -euo pipefail

          command -v clang
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

          clang --version
          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

          echo "All required compilers are available."

      - name: Download and pin KernelSU Next legacy source
        shell: bash
        run: |
          set -euo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          test -d KernelSU-Next
          test -d drivers/kernelsu

          cd KernelSU-Next

          git fetch --depth=1 origin "$KSU_REVISION"
          git checkout --detach "$KSU_REVISION"

          ACTUAL_REVISION="$(git rev-parse --short=8 HEAD)"

          echo "KernelSU Next revision: $ACTUAL_REVISION"

          if [ "$ACTUAL_REVISION" != "$KSU_REVISION" ]; then
            echo "ERROR: KernelSU Next revision mismatch."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          echo "Pinned KernelSU Next source verified."

      - name: Apply Linux 4.4 KernelSU compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$GITHUB_WORKSPACE/reference/patches/kernelsu-next-linux-4.4-compat.diff"

          test -s "$PATCH"

          git -C KernelSU-Next apply --check "$PATCH"
          git -C KernelSU-Next apply "$PATCH"

          echo "Linux 4.4 KernelSU compatibility patch applied."

      - name: Set KernelSU Next version metadata
        shell: bash
        run: |
          set -euo pipefail

          KBUILD="drivers/kernelsu/Kbuild"

          test -f "$KBUILD"

          python3 - "$KBUILD" "$KSU_VERSION" "$KSU_VERSION_TAG" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]
          tag = sys.argv[3]

          text = path.read_text()

          old_version = "KSU_VERSION_FALLBACK := 1"
          old_tag = "KSU_VERSION_TAG_FALLBACK := v0.0.1"

          new_version = f"KSU_VERSION_FALLBACK := {version}"
          new_tag = f"KSU_VERSION_TAG_FALLBACK := {tag}"

          if new_version not in text:
              if old_version not in text:
                  raise SystemExit(
                      "ERROR: Expected version fallback was not found."
                  )
              text = text.replace(old_version, new_version, 1)

          if new_tag not in text:
              if old_tag not in text:
                  raise SystemExit(
                      "ERROR: Expected tag fallback was not found."
                  )
              text = text.replace(old_tag, new_tag, 1)

          path.write_text(text)

          verified = path.read_text()

          if new_version not in verified:
              raise SystemExit("ERROR: Version metadata verification failed.")

          if new_tag not in verified:
              raise SystemExit("ERROR: Tag metadata verification failed.")

          print(f"KernelSU Next version set to {version}")
          print(f"KernelSU Next tag set to {tag}")
          PY

          grep -nE 'KSU_VERSION_FALLBACK|KSU_VERSION_TAG_FALLBACK' "$KBUILD"

      - name: Apply Linux 4.4 source compatibility fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          # Compatibility fix for the Linux 4.4 copy_to_iter() signature.
          ksud = Path("drivers/kernelsu/runtime/ksud_integration.c")

          if not ksud.is_file():
              raise SystemExit(f"ERROR: Missing {ksud}")

          text = ksud.read_text()

          old = "copy_to_iter(KERNEL_SU_RC + ksu_rc_pos,"
          new = "copy_to_iter((void *)(KERNEL_SU_RC + ksu_rc_pos),"

          if new not in text:
              if old not in text:
                  raise SystemExit(
                      "ERROR: Expected copy_to_iter() call was not found."
                  )

              text = text.replace(old, new, 1)
              ksud.write_text(text)

          if new not in ksud.read_text():
              raise SystemExit("ERROR: copy_to_iter() fix verification failed.")

          print("PASS: copy_to_iter() compatibility fix")

          # Backport path_umount() and can_umount() for Linux 4.4.
          namespace = Path("fs/namespace.c")
          internal = Path("fs/internal.h")

          if not namespace.is_file() or not internal.is_file():
              raise SystemExit("ERROR: Filesystem source files are missing.")

          ns_text = namespace.read_text()

          has_can_umount = "static int can_umount(" in ns_text
          has_path_umount = "int path_umount(" in ns_text

          if not has_can_umount and not has_path_umount:
              marker = "static bool is_mnt_ns_file(struct dentry *dentry)"

              if marker not in ns_text:
                  raise SystemExit(
                      "ERROR: namespace.c insertion point was not found."
                  )

              backport = r'''
          static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);

              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;
              if (!may_mount())
                  return -EPERM;
              if (path->dentry != path->mnt->mnt_root)
                  return -EINVAL;
              if (!check_mnt(mnt))
                  return -EINVAL;
              if (mnt->mnt.mnt_flags & MNT_LOCKED)
                  return -EINVAL;
              if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                  return -EPERM;

              return 0;
          }

          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;

              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);

              /* Do not use path_put(), which clears mnt_expiry_mark. */
              dput(path->dentry);
              mntput_no_expire(mnt);

              return ret;
          }

          '''

              ns_text = ns_text.replace(marker, backport + marker, 1)
              namespace.write_text(ns_text)

          elif not has_can_umount or not has_path_umount:
              raise SystemExit(
                  "ERROR: Only part of the path_umount backport exists."
              )

          ns_text = namespace.read_text()

          if "static int can_umount(" not in ns_text:
              raise SystemExit("ERROR: can_umount() verification failed.")

          if "int path_umount(" not in ns_text:
              raise SystemExit("ERROR: path_umount() verification failed.")

          print("PASS: path_umount() and can_umount() backport")

          # Add the declaration required by KernelSU.
          internal_text = internal.read_text()

          declaration = "int path_umount(struct path *path, int flags);"
          marker = "extern void __init mnt_init(void);"

          if declaration not in internal_text:
              if marker not in internal_text:
                  raise SystemExit(
                      "ERROR: fs/internal.h insertion point was not found."
                  )

              internal_text = internal_text.replace(
                  marker,
                  marker + "\n" + declaration,
                  1
              )

              internal.write_text(internal_text)

          if declaration not in internal.read_text():
              raise SystemExit(
                  "ERROR: path_umount() declaration verification failed."
              )

          print("PASS: path_umount() declaration")
          PY

      - name: Verify KernelSU source changes
        shell: bash
        run: |
          set -euo pipefail

          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/runtime/ksud_integration.c

          grep -q 'KSU_VERSION_FALLBACK := 33193' drivers/kernelsu/Kbuild
          grep -q 'KSU_VERSION_TAG_FALLBACK := v3.2.0-legacy-14' drivers/kernelsu/Kbuild

          grep -q 'copy_to_iter((void \*)' drivers/kernelsu/runtime/ksud_integration.c

          grep -q 'int path_umount(struct path \*path, int flags)' fs/namespace.c
          grep -q 'int path_umount(struct path \*path, int flags);' fs/internal.h

          echo "All KernelSU source changes verified."

      - name: Configure OnePlus 5 kernel
        shell: bash
        run: |
          set -euo pipefail

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            lineage_oneplus5_defconfig

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config

          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' out/.config; then
            echo "ERROR: Kprobes hook mode must remain disabled."
            exit 1
          fi

          echo "KernelSU configuration verified:"
          grep -E '^CONFIG_KSU(=|_)' out/.config

      - name: Build kernel
        id: build_kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking compilers..."
          command -v clang
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

          clang --version

          echo "Building kernel Image.gz and device tree blobs..."

          make -j"$JOBS" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            Image.gz dtbs 2>&1 | tee kernel-build.log

          test -s out/arch/arm64/boot/Image.gz

          DTB_DIR="out/arch/arm64/boot/dts/qcom"

          for dtb in \
            cheeseburger-v2.1-dvt1.dtb \
            cheeseburger-v2.1-backup.dtb \
            dumpling-v2.1-dvt.dtb \
            cheeseburger-v2.1-pvt.dtb \
            dumpling-v2.1-Second_Resource.dtb \
            dumpling-v2.1-pvt.dtb \
            dumpling-v2.1-backup.dtb \
            cheeseburger-v2.1-pvt1.dtb
          do
            test -s "$DTB_DIR/$dtb"
            echo "Verified: $dtb"
          done

          # Verify that the intended version metadata was actually used.
          grep -F -- "-- KernelSU-Next version fallback: 33193" kernel-build.log
          grep -F -- "-- KernelSU-Next tag fallback: v3.2.0-legacy-14" kernel-build.log

          echo "Kernel image, version metadata, and all eight DTBs verified."

      - name: Generate build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          BUILD_OUTCOME="${{ steps.build_kernel.outcome }}"

          {
            echo "OnePlus 5 KernelSU Next Kernel Build Report"
            echo "Device: OnePlus 5 (cheeseburger)"
            echo "Architecture: ARM64"
            echo "Kernel version: 4.4.302"
            echo "Branch: lineage-22.2"
            echo "Integration commit: 8e7088d77725"
            echo "Current source commit: $(git rev-parse HEAD)"
            echo "KernelSU Next revision: $KSU_REVISION"
            echo "KernelSU Next version: $KSU_VERSION"
            echo "KernelSU Next tag: $KSU_VERSION_TAG"
            echo "Defconfig: lineage_oneplus5_defconfig"
            echo "Compiler: Android NDK r25c Clang"
            echo "Build step outcome: $BUILD_OUTCOME"
            echo
            echo "KernelSU configuration:"
            grep -E '^CONFIG_KSU(=|_)' out/.config 2>/dev/null || true
            echo
            echo "Kernel image:"
            ls -lh out/arch/arm64/boot/Image.gz 2>/dev/null || true
            echo
            echo "Device tree blobs:"
            find out/arch/arm64/boot/dts/qcom \
              -maxdepth 1 -name '*.dtb' -type f -print 2>/dev/null | sort || true
            echo
            echo "Build log: kernel-build.log"
          } > kernel-build-report.txt

          cat kernel-build-report.txt

      - name: Upload kernel build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus5-kernelsu-next-kernel-build
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/qcom/*.dtb
            out/vmlinux
            out/System.map
            out/.config
            kernel-build.log
            kernel-build-report.txt
          if-no-files-found: warn
          compression-level: 6
