      - name: Download and apply Linux 4.4 KernelSU compatibility patch
        shell: bash
        run: |
          set -Eeuo pipefail

          trap 'rc=$?; echo "::error::Command failed at line ${LINENO}: ${BASH_COMMAND} (exit code ${rc})"; exit "$rc"' ERR

          PATCH="${RUNNER_TEMP}/kernelsu-next-linux-4.4-compat.diff"
          KSU_DIR="KernelSU-Next"
          COMPAT_HEADER="${KSU_DIR}/kernel/compat/kernel_compat.h"

          echo "===== STEP 1: Check KernelSU source directory ====="

          if [[ ! -d "$KSU_DIR" ]]; then
            echo "::error::KernelSU-Next directory does not exist."
            exit 1
          fi

          for file in \
            "$COMPAT_HEADER" \
            "${KSU_DIR}/kernel/feature/adb_root.c" \
            "${KSU_DIR}/kernel/feature/selinux_hide.c"
          do
            if [[ -f "$file" ]]; then
              echo "PASS: Found $file"
            else
              echo "::error::Required KernelSU source file is missing: $file"
              exit 1
            fi
          done

          echo
          echo "===== STEP 2: Download compatibility patch ====="

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 120 \
            "https://raw.githubusercontent.com/TosteRino/joan-kernelsu/main/patches/kernelsu-next-linux-4.4-compat.diff" \
            --output "$PATCH"

          if [[ ! -s "$PATCH" ]]; then
            echo "::error::Downloaded patch is empty or missing."
            exit 1
          fi

          echo "PASS: Patch downloaded."
          echo "Patch size:"
          wc -c "$PATCH"
          echo "Patch line count:"
          wc -l "$PATCH"

          echo
          echo "===== STEP 3: Inspect patch contents ====="

          echo "Patch file headers:"
          grep -nE '^(diff --git|--- |\+\+\+ )' "$PATCH" || {
            echo "::error::No standard unified diff file headers found."
            exit 1
          }

          echo
          echo "Checking ALIGN_DOWN..."

          if grep -Fn -- 'ALIGN_DOWN' "$PATCH"; then
            echo "PASS: ALIGN_DOWN found in patch."
          else
            echo "::error::ALIGN_DOWN is missing from the downloaded patch."
            exit 1
          fi

          echo
          echo "Checking __nocfi..."

          if grep -Fn -- '__nocfi' "$PATCH"; then
            echo "PASS: __nocfi found in patch."
          else
            echo "::error::__nocfi is missing from the downloaded patch."
            exit 1
          fi

          echo
          echo "===== STEP 4: Check whether patch can be applied ====="

          if git -C "$KSU_DIR" apply --check --verbose "$PATCH"; then
            echo "PASS: Git confirms that the patch can be applied."
          else
            rc=$?
            echo "::error::Patch applicability check failed with exit code ${rc}."
            echo "Git patch diagnostic:"
            git -C "$KSU_DIR" apply --check --verbose "$PATCH" || true
            exit "$rc"
          fi

          echo
          echo "===== STEP 5: Apply compatibility patch ====="

          if git -C "$KSU_DIR" apply "$PATCH"; then
            echo "PASS: Compatibility patch applied."
          else
            rc=$?
            echo "::error::Applying the compatibility patch failed with exit code ${rc}."
            exit "$rc"
          fi

          echo
          echo "===== STEP 6: Verify patched KernelSU files ====="

          if grep -Fn -- 'ALIGN_DOWN' "$COMPAT_HEADER"; then
            echo "PASS: ALIGN_DOWN found in kernel_compat.h."
          else
            echo "::error::ALIGN_DOWN was not found in the patched header."
            exit 1
          fi

          if grep -Fn -- '__nocfi' "$COMPAT_HEADER"; then
            echo "PASS: __nocfi found in kernel_compat.h."
          else
            echo "::error::__nocfi was not found in the patched header."
            exit 1
          fi

          if grep -Fq -- 'kernel_compat.h' "${KSU_DIR}/kernel/feature/adb_root.c"; then
            echo "PASS: adb_root.c includes the compatibility header."
          else
            echo "::error::adb_root.c does not include kernel_compat.h."
            exit 1
          fi

          if grep -Fq -- 'kernel_compat.h' "${KSU_DIR}/kernel/feature/selinux_hide.c"; then
            echo "PASS: selinux_hide.c includes the compatibility header."
          else
            echo "::error::selinux_hide.c does not include kernel_compat.h."
            exit 1
          fi

          echo
          echo "===== RESULT ====="
          echo "SUCCESS: Linux 4.4 compatibility patch applied and verified."
