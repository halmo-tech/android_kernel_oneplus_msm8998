name: KernelSU Final Source Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OnePlus 5 kernel
        uses: actions/checkout@v5
        with:
          ref: lineage-22.2

      - name: Integrate KernelSU Next legacy source
        shell: bash
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Print exact kernel source sections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          sections = [
              ("kernel/sys.c", 580, 650),
              ("fs/exec.c", 1530, 1678),
              ("fs/open.c", 340, 365),
              ("fs/read_write.c", 435, 465),
              ("fs/stat.c", 270, 315),
              ("fs/stat.c", 400, 445),
              ("kernel/reboot.c", 275, 320),
              ("security/selinux/hooks.c", 2260, 2305),
          ]

          for filename, first, last in sections:
              path = Path(filename)
              print("\n" + "=" * 78)
              print(f"{filename}, lines {first}-{last}")
              print("=" * 78)

              if not path.exists():
                  print("FILE NOT FOUND")
                  continue

              lines = path.read_text(errors="replace").splitlines()

              for number in range(first, min(last, len(lines)) + 1):
                  print(f"{number}: {lines[number - 1]}")
          PY

      - name: Search KernelSU source and hook references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path("KernelSU-Next"),
              Path("kernel"),
              Path("fs"),
              Path("security"),
          ]

          terms = [
              "is_ksu_transition",
              "ksu_handle_execveat",
              "ksu_handle_faccessat",
              "ksu_handle_vfs_read",
              "ksu_handle_stat",
              "ksu_handle_newfstat_ret",
              "ksu_handle_fstat64_ret",
              "ksu_handle_sys_reboot",
              "ksu_handle_setresuid",
              "ksu_handle_execveat_sucompat",
          ]

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix not in {".c", ".h"}:
                      continue

                  try:
                      lines = path.read_text(errors="replace").splitlines()
                  except Exception:
                      continue

                  matches = []
                  for number, line in enumerate(lines, 1):
                      if any(term in line for term in terms):
                          matches.append((number, line))

                  if matches:
                      print("\n" + "=" * 78)
                      print(path)
                      print("=" * 78)
                      for number, line in matches:
                          print(f"{number}: {line}")
          PY

      - name: Inspect KernelSU configuration
        shell: bash
        run: |
          echo "===== OnePlus 5 defconfig ====="
          grep -n -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KRETPROBES" \
            arch/arm64/configs/lineage_oneplus5_defconfig || true

          echo
          echo "===== KernelSU Kconfig ====="
          find KernelSU-Next -name Kconfig -o -name Kconfig.*

      - name: Upload inspection report
        uses: actions/upload-artifact@v6
        with:
          name: oneplus5-kernelsu-final-source-inspection
          path: |
            arch/arm64/configs/lineage_oneplus5_defconfig
          if-no-files-found: error
