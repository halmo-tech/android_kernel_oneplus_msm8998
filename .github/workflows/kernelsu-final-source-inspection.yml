name: KernelSU Final Source Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect OnePlus 5 Kernel Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OnePlus 5 kernel
        uses: actions/checkout@v4
        with:
          ref: lineage-22.2
          fetch-depth: 1

      - name: Integrate KernelSU Next legacy source
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          echo
          echo "===== KernelSU source directory ====="
          if [ -d KernelSU-Next ]; then
            echo "KernelSU-Next directory found"
            find KernelSU-Next -maxdepth 2 -type f | head -40
          else
            echo "ERROR: KernelSU-Next directory was not created"
            echo "Checking likely integration locations:"
            find . -maxdepth 4 -iname '*kernelsu*' -print
            exit 1
          fi

      - name: Inspect exact source locations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def show(filename, start, end):
              path = Path(filename)

              print()
              print("=" * 78)
              print(f"{filename}, lines {start}-{end}")
              print("=" * 78)

              if not path.exists():
                  print(f"ERROR: File not found: {filename}")
                  return

              lines = path.read_text(errors="replace").splitlines()

              for number in range(start, min(end, len(lines)) + 1):
                  print(f"{number}: {lines[number - 1]}")

          show("kernel/sys.c", 580, 650)
          show("fs/exec.c", 1530, 1620)
          show("fs/exec.c", 1620, 1680)
          show("fs/open.c", 340, 390)
          show("fs/read_write.c", 435, 465)
          show("fs/stat.c", 270, 315)
          show("fs/stat.c", 400, 445)
          show("kernel/reboot.c", 275, 325)
          show("security/selinux/hooks.c", 2260, 2305)

          show("KernelSU-Next/kernel/core/init.c", 20, 55)
          show("KernelSU-Next/kernel/runtime/ksud_integration.c", 270, 310)
          show("KernelSU-Next/kernel/runtime/ksud_integration.c", 935, 1050)
          show("KernelSU-Next/kernel/selinux/selinux.c", 1, 100)
          show("KernelSU-Next/kernel/selinux/selinux.h", 1, 140)
          show("KernelSU-Next/kernel/hook/setuid_hook.c", 1, 100)
          PY

      - name: Search KernelSU hook declarations and references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path("KernelSU-Next"),
              Path("kernel"),
              Path("fs"),
              Path("security"),
          ]

          terms = [
              "is_ksu_transition",
              "ksu_handle_execveat",
              "ksu_handle_faccessat",
              "ksu_handle_vfs_read",
              "ksu_handle_stat",
              "ksu_handle_newfstat_ret",
              "ksu_handle_fstat64_ret",
              "ksu_handle_sys_reboot",
              "ksu_handle_setresuid",
              "ksu_handle_execveat_sucompat",
          ]

          extensions = {".c", ".h"}

          for root in roots:
              if not root.exists():
                  print(f"WARNING: Directory not found: {root}")
                  continue

              for path in sorted(root.rglob("*")):
                  if not path.is_file() or path.suffix not in extensions:
                      continue

                  try:
                      lines = path.read_text(errors="replace").splitlines()
                  except Exception as error:
                      print(f"Could not read {path}: {error}")
                      continue

                  matches = []

                  for number, line in enumerate(lines, 1):
                      if any(term in line for term in terms):
                          matches.append((number, line))

                  if matches:
                      print()
                      print("=" * 78)
                      print(path)
                      print("=" * 78)

                      for number, line in matches:
                          print(f"{number}: {line}")
          PY

      - name: Inspect KernelSU configuration
        shell: bash
        run: |
          echo "===== OnePlus 5 defconfig ====="
          nl -ba arch/arm64/configs/lineage_oneplus5_defconfig

          echo
          echo "===== KernelSU Kconfig ====="

          if [ -f KernelSU-Next/kernel/Kconfig ]; then
            nl -ba KernelSU-Next/kernel/Kconfig
          else
            echo "ERROR: KernelSU Kconfig not found"
          fi

          echo
          echo "===== KernelSU integration status ====="
          git status --short

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oneplus5-kernelsu-source-inspection
          path: |
            arch/arm64/configs/lineage_oneplus5_defconfig
            KernelSU-Next/kernel/Kconfig
          if-no-files-found: warn
          retention-days: 7
